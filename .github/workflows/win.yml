name: Build (Windows x86/x64)

on:
  push:
    branches: [ "master" ]
    paths:
      - src/**
  pull_request:
    branches: [ "master" ]
    paths:
      - src/**
  workflow_dispatch:
    branches: [ "master" ]

jobs:

  build-win:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sys: mingw32, env: i686, name: x86, runs-on: 'windows-latest' }
          - { sys: mingw64, env: x86_64, name: x64, runs-on: 'windows-latest' }
          # - { sys: ucrt64, env: ucrt-x86_64, runs-on: 'windows-latest' }
          # - { sys: clang64, env: clang-x86_64, runs-on: 'windows-latest' }
          # - { sys: clangarm64, env: clang-aarch64, name: ARM64, runs-on: 'windows-11-arm' }

    name: Build (Windows ${{ matrix.name }})
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{matrix.sys}}
        update: true
        install: >-
          git
          make
          mingw-w64-${{matrix.env}}-SDL2
          mingw-w64-x86_64-wxwidgets3.2
        pacboy: >-
          toolchain:p
          cmake:p
          ninja:p
    
    - name: Create build directory
      run: mkdir -p build

    - name: Configure with CMake
      run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build

    - name: Prepare structure
      run: |
        mkdir -p pkg/win
        cp ./build/miniCDi.exe ./pkg/win/miniCDi.exe
    
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: miniCDi
        path: ./pkg/win/