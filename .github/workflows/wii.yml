name: Build (Wii)

on: [push, pull_request, workflow_dispatch]

jobs:

  build-wii:
    name: Build (Wii)
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Wii packages
      run: |
        sudo dkp-pacman-key --recv-keys C8A2759C315CFBC3429CC2E422B803BA8AA3D7CE --keyserver keyserver.ubuntu.com
        sudo dkp-pacman-key --lsign-key C8A2759C315CFBC3429CC2E422B803BA8AA3D7CE
        sudo dkp-pacman -Syu --noconfirm
        sudo dkp-pacman -S --needed --noconfirm wii-sdl2 wii-sdl2_image
    
    - name: Create build directory
      run: mkdir -p build
    
    - name: Configure with CMake
      run: |
        /opt/devkitpro/portlibs/wii/bin/powerpc-eabi-cmake -S. -B build
    
    - name: Build
      run: |
        /opt/devkitpro/portlibs/wii/bin/powerpc-eabi-cmake --build build
    
