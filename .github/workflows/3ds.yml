name: Build (Nintendo 3DS)

on:
  push:
    branches: [ "master" ]
    paths:
      - src/**
  pull_request:
    branches: [ "master" ]
    paths:
      - src/**
  workflow_dispatch:
    branches: [ "master" ]

jobs:

  build-3ds:
    name: Build (Nintendo 3DS)
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        for i in {1..3}; do
          echo "Syncing package databases (attempt $i of 3)"
          if dkp-pacman -Syu --noconfirm; then
            break
          else
            sleep 5
          fi
        done
        
        dkp-pacman -S --needed --noconfirm 3ds-dev libctru citro3d citro2d
    
    - name: Create build directory
      run: mkdir -p build
    
    - name: Configure with CMake
      run: /opt/devkitpro/portlibs/3ds/bin/arm-none-eabi-cmake -S. -B build
    
    - name: Build
      run: /opt/devkitpro/portlibs/3ds/bin/arm-none-eabi-cmake --build build
    
    - name: Prepare structure
      run: |
        mkdir -p pkg/3ds/3ds/miniCDi
        mkdir -p pkg/3ds/3ds/miniCDi/rom
        cp ./build/miniCDi.3dsx ./pkg/3ds/3ds/miniCDi/boot.3dsx
    
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: miniCDi
        path: ./pkg/3ds/