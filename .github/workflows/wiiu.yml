name: Build (Nintendo Wii U)

on:
  push:
    branches: [ "master" ]
    paths:
      - src/**
  pull_request:
    branches: [ "master" ]
    paths:
      - src/**
  workflow_dispatch:
    branches: [ "master" ]

jobs:

  build-wiiu:
    name: Build (Nintendo Wii U)
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        for i in {1..3}; do
          echo "Syncing package databases (attempt $i of 3)"
          if dkp-pacman -Syu --noconfirm; then
            break
          else
            sleep 5
          fi
        done
        
        dkp-pacman -S --needed --noconfirm wiiu-dev wiiu-sdl2 wiiu-sdl2_image wut-tools
    
    - name: Create build directory
      run: mkdir -p build
    
    - name: Configure with CMake
      run: /opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-cmake -S. -B build
    
    - name: Build
      run: /opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-cmake --build build
    
    - name: Prepare structure
      run: |
        mkdir -p pkg/wiiu/wiiu/apps/miniCDi
        cp ./build/miniCDi.wuhb ./pkg/wiiu/wiiu/apps/miniCDi/miniCDi.wuhb
    
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: miniCDi
        path: ./pkg/wiiu/