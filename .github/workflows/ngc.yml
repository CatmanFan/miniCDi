name: Build (Nintendo GameCube)

on:
  push:
    branches: [ "master" ]
    paths:
      - src/**
  pull_request:
    branches: [ "master" ]
    paths:
      - src/**
  workflow_dispatch:
    branches: [ "master" ]

jobs:

  build-ngc:
    name: Build (Nintendo GameCube)
    runs-on: ubuntu-latest
    container: ghcr.io/extremscorner/libogc2:latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        for i in {1..3}; do
          echo "Syncing package databases (attempt $i of 3)"
          if dkp-pacman -Syu --noconfirm; then
            break
          else
            sleep 5
          fi
        done
        
        dkp-pacman -S --needed --noconfirm gamecube-sdl2
    
    - name: Create build directory
      run: mkdir -p build
    
    - name: Configure with CMake
      run: /opt/devkitpro/libogc2/gamecube/bin/powerpc-eabi-cmake -S. -B build
    
    - name: Build
      run: /opt/devkitpro/libogc2/gamecube/bin/powerpc-eabi-cmake --build build
    
    - name: Prepare structure
      run: |
        mkdir -p pkg/ngc/miniCDi
        mkdir -p pkg/ngc/miniCDi/rom
        cp ./build/miniCDi.dol ./pkg/ngc/miniCDi/boot.dol
    
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: miniCDi
        path: ./pkg/ngc/