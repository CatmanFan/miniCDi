name: Build (Wii)

on: [push, pull_request, workflow_dispatch]

jobs:

  build-wii:
    name: Build (Wii)
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: recursive
    
    - name: Install Wii packages
      run: |
        dkp-pacman -Syu --noconfirm
        dkp-pacman -S --needed --noconfirm wii-sdl2 wii-sdl2_image
    
    - name: Create build directory
      run: mkdir -p build
    
    - name: Configure with CMake
      run: |
        /opt/devkitpro/portlibs/wii/bin/powerpc-eabi-cmake -S. -B build
    
    - name: Build
      run: |
        /opt/devkitpro/portlibs/wii/bin/powerpc-eabi-cmake --build build
        cp ./build/miniCDi.dol ./build/res/wii/boot.dol
        cp ./res/wii/icon.png ./build/res/wii/icon.png
    
    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: miniCDi (Wii)
        path: ./build/res/wii/