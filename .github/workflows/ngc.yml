name: Build (Nintendo GameCube)

on:
  push:
    branches: [ "master" ]
    paths:
      - src/**
  pull_request:
    branches: [ "master" ]
    paths:
      - src/**
  workflow_dispatch:
    branches: [ "master" ]

jobs:

  build-ngc:
    name: Build (Nintendo GameCube)
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        dkp-pacman -Syu --noconfirm
        dkp-pacman -S --needed --noconfirm gamecube-sdl2 gamecube-sdl2_image
    
    - name: Create build directory
      run: mkdir -p build
    
    - name: Configure with CMake
      run: /opt/devkitpro/portlibs/gamecube/bin/powerpc-eabi-cmake -S. -B build
    
    - name: Build
      run: /opt/devkitpro/portlibs/gamecube/bin/powerpc-eabi-cmake --build build
    
    - name: Prepare structure
      run: |
        mkdir -p pkg/ngc/miniCDi
        mkdir -p pkg/ngc/miniCDi/rom
        cp ./build/miniCDi.dol ./pkg/ngc/miniCDi/boot.dol
    
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: miniCDi
        path: ./pkg/ngc/